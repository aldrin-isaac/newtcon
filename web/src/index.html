<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>newtcon</title>
    <link rel="stylesheet" href="design-system/color.css" />
    <link rel="stylesheet" href="design-system/typography.css" />
    <link rel="stylesheet" href="design-system/spacing.css" />
    <link rel="stylesheet" href="design-system/motion.css" />
    <link rel="stylesheet" href="workspace.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>newtcon</h1>
      <p class="page-subtitle">
        What this network knows — services, policies, filters, profiles, and zones defined in newtron.
      </p>
    </header>
    <nav class="workspace-tabs" role="tablist" aria-label="Workspace views">
      <button
        class="workspace-tab workspace-tab--active"
        role="tab"
        id="tab-specs"
        aria-controls="panel-specs"
        aria-selected="true"
        type="button"
      >Specs</button>
      <button
        class="workspace-tab"
        role="tab"
        id="tab-topology"
        aria-controls="panel-topology"
        aria-selected="false"
        type="button"
      >Topology</button>
      <button
        class="workspace-tab"
        role="tab"
        id="tab-lab"
        aria-controls="panel-lab"
        aria-selected="false"
        type="button"
      >Lab</button>
    </nav>
    <main id="panel-specs" class="workspace" role="tabpanel" aria-labelledby="tab-specs">
      <p class="status-loading">Loading…</p>
    </main>
    <main id="panel-topology" class="workspace workspace--topology" role="tabpanel" aria-labelledby="tab-topology" hidden>
      <p class="status-loading">Loading…</p>
    </main>
    <main id="panel-lab" class="workspace workspace--lab" role="tabpanel" aria-labelledby="tab-lab" hidden>
      <p class="status-loading">Loading…</p>
    </main>
    <aside id="detail-drawer" class="drawer" aria-hidden="true">
      <button id="drawer-close" class="drawer-close" type="button" aria-label="Close">×</button>
      <div id="drawer-content" class="drawer-content"></div>
    </aside>
    <footer class="site-footer">
      <small>
        Connected to newtron on <code id="newtron-target">—</code> &middot;
        <a href="/api/health">health</a> &middot;
        <a href="/CLAUDE.md">CLAUDE.md</a>
      </small>
    </footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
