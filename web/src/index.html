<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Immediate redirect to the services-listing page. -->
    <!-- meta-refresh is the static-file-safe redirect; no JS required. -->
    <meta http-equiv="refresh" content="0; url=/services/" />
    <title>newtcon</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #f9f9f8;
        color: #1a1a1a;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 0.5rem;
        text-align: center;
      }
      p { font-size: 0.875rem; color: #6b7280; }
      a { color: #4a90d9; }
    </style>
  </head>
  <body>
    <main>
      <p>Redirecting to <a href="/services/">services</a>&hellip;</p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
