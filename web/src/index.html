<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>newtcon</title>
    <link rel="stylesheet" href="design-system/color.css" />
    <link rel="stylesheet" href="design-system/typography.css" />
    <link rel="stylesheet" href="design-system/spacing.css" />
    <link rel="stylesheet" href="design-system/motion.css" />
    <link rel="stylesheet" href="design-system/components.css" />
    <link rel="stylesheet" href="workspace.css" />
    <link rel="stylesheet" href="auth-gate.css" />
  </head>
  <body>
    <div class="app-shell">

      <aside class="app-sidebar" aria-label="Primary">
        <div class="brand">
          <span class="brand-mark">N</span>
          <span class="brand-name">newtcon</span>
        </div>
        <nav class="nav" role="navigation" aria-label="Workspaces">
          <button type="button" id="tab-specs" class="nav-item nav-item--active" role="tab" aria-selected="true">
            <span class="nav-icon" data-icon="list"></span>
            <span class="nav-label">Specs</span>
          </button>
          <button type="button" id="tab-topology" class="nav-item" role="tab" aria-selected="false">
            <span class="nav-icon" data-icon="network"></span>
            <span class="nav-label">Topology</span>
          </button>
          <button type="button" id="tab-permissions" class="nav-item" role="tab" aria-selected="false">
            <span class="nav-icon" data-icon="shield-check"></span>
            <span class="nav-label">Permissions</span>
          </button>
          <button type="button" id="tab-history" class="nav-item" role="tab" aria-selected="false">
            <span class="nav-icon" data-icon="activity"></span>
            <span class="nav-label">History</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <button type="button" class="palette-trigger" id="palette-trigger" title="Open command palette">
            <span class="nav-icon" data-icon="command"></span>
            <span>Quick search</span>
            <span class="kbd-group"><span class="kbd">⌘</span><span class="kbd">K</span></span>
          </button>
        </div>
      </aside>

      <div class="app-main">

        <header class="app-header">
          <div class="breadcrumbs" id="breadcrumbs">
            <span class="crumb" id="crumb-view">Specs</span>
          </div>
          <div class="header-status">
            <button type="button" id="network-switcher-trigger" class="network-switcher-trigger" title="Active newtron network — click to switch">
              <span class="network-switcher-icon" data-icon="network"></span>
              <span class="network-switcher-label">default</span>
              <span class="network-switcher-chevron" data-icon="chevron-down"></span>
            </button>
            <div id="pending-bar" class="pending-bar" hidden>
              <button type="button" id="pending-bar-toggle" class="pending-bar-toggle" title="Show pending changes">
                <span class="pending-bar-count">0</span>
                <span class="pending-bar-label">pending</span>
              </button>
              <button type="button" id="pending-bar-discard" class="btn btn-ghost btn-sm">Discard</button>
              <button type="button" id="pending-bar-save" class="btn btn-primary btn-sm">Save</button>
            </div>
            <div id="pending-bar-list" class="pending-bar-list" hidden></div>
            <span class="status-pill" id="newtron-pill" title="newtron connection">
              <span class="status-dot status-dot--unknown" id="newtron-dot"></span>
              <span id="newtron-target">checking…</span>
            </span>
            <div class="user-pill-wrap" id="user-pill-wrap" hidden>
              <button type="button" class="user-pill" id="user-pill-trigger" title="Signed-in operator — click for details">
                <span class="user-pill-name" id="user-pill-name"></span>
                <span class="user-pill-chevron" data-icon="chevron-down"></span>
              </button>
              <div class="user-pill-dropdown" id="user-pill-dropdown" hidden role="menu">
                <div class="user-pill-dropdown-row">
                  <div class="user-pill-dropdown-label">Signed in as</div>
                  <div class="user-pill-dropdown-value" id="user-pill-dropdown-username"></div>
                </div>
                <div class="user-pill-dropdown-row">
                  <div class="user-pill-dropdown-label">Session expires</div>
                  <div class="user-pill-dropdown-value" id="user-pill-dropdown-expires"></div>
                </div>
                <button type="button" class="user-pill-dropdown-signout" id="user-signout">Sign out</button>
              </div>
            </div>
          </div>
        </header>

        <main class="app-content" id="app-content">
          <section class="view view-specs" id="panel-specs">
            <!-- mounted by app.ts mount() -->
          </section>
          <section class="view view-topology" id="panel-topology" hidden>
            <!-- mounted by app.ts mountTopologyTab() -->
          </section>
          <section class="view view-permissions" id="panel-permissions" hidden>
            <!-- mounted by authorization.ts mountAuthorizationTab() -->
          </section>
          <section class="view view-history" id="panel-history" hidden>
            <!-- mounted by history.ts mountHistoryTab() -->
          </section>
        </main>
      </div>

      <aside id="detail-drawer" class="drawer" aria-hidden="true" aria-label="Detail panel">
        <header class="drawer-header">
          <div id="drawer-breadcrumb" class="drawer-breadcrumb"></div>
          <button id="drawer-close" type="button" class="btn btn-ghost btn-icon-only" aria-label="Close detail">
            <span data-icon="x"></span>
          </button>
        </header>
        <div id="drawer-content" class="drawer-content"></div>
      </aside>

      <!-- Auth overlay (hydrated by auth-gate.ts). Hidden by default; shown when
           /api/auth/whoami returns 401 at boot or when any /api/* call returns
           401 mid-session. -->
      <div id="auth-overlay" class="auth-overlay" hidden role="dialog" aria-modal="true" aria-label="Sign in to newtcon">
        <form id="auth-form" class="auth-card">
          <h2 class="auth-card-title">Sign in to newtcon</h2>
          <p class="auth-card-subtitle">Use your operator account credentials.</p>
          <div id="auth-error" class="auth-error" hidden></div>
          <label class="auth-field">
            <span class="auth-field-label">Username</span>
            <input type="text" class="input" id="auth-username" autocomplete="username" autocapitalize="off" autocorrect="off" required />
          </label>
          <label class="auth-field">
            <span class="auth-field-label">Password</span>
            <input type="password" class="input" id="auth-password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="btn btn-primary auth-submit" id="auth-submit">Sign in</button>
        </form>
      </div>

      <div id="palette-overlay" class="palette-overlay" hidden role="dialog" aria-modal="true" aria-label="Command palette">
        <div class="palette" role="document">
          <div class="palette-search">
            <span data-icon="search"></span>
            <input type="text" id="palette-input" placeholder="Type to filter specs, devices, actions…" autocomplete="off" />
            <span class="kbd">esc</span>
          </div>
          <div id="palette-results" class="palette-results"></div>
        </div>
      </div>
    </div>

    <script type="module" src="shell.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
