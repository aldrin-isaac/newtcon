<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services — newtcon</title>
    <link rel="stylesheet" href="/services/services.css" />
  </head>
  <body>
    <header class="site-header">
      <span class="site-name">newtcon</span>
      <nav class="site-nav" aria-label="primary">
        <a href="/" class="nav-link nav-link--active" aria-current="page">Services</a>
      </nav>
    </header>

    <main id="main">
      <div class="page-heading">
        <h1>Services</h1>
        <p class="page-subtitle">
          Services configured in newtron — what this network can be composed against.
        </p>
      </div>

      <div id="services-root" aria-live="polite" aria-busy="true">
        <!-- Populated by services.ts mount() -->
        <p class="status-loading">Loading&#x2026;</p>
      </div>
    </main>

    <footer class="site-footer">
      <span class="footer-note">Services are listed first because operators reason about networks in terms of services, not individual devices.</span>
    </footer>

    <script type="module" src="/services/services.js"></script>
    <script type="module">
      import { mount } from "/services/services.js";
      const root = document.getElementById("services-root");
      if (root) root.setAttribute("aria-busy", "true");
      mount().then(() => {
        if (root) root.removeAttribute("aria-busy");
      });
    </script>
  </body>
</html>
